<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0F1A">
<title>VITAL · Đăng nhập</title>
<!-- PWA: cài lên điện thoại + chạy offline -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VITAL">
<script>if('serviceWorker'in navigator){addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){})})}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>

<main class="scene" id="scene">
  <canvas id="particles" aria-hidden="true"></canvas>

  <!-- Header -->
  <header class="hd">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span>VITAL</span>
    </div>
    <div class="greeting" id="greeting"></div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <p class="hero__eyebrow">
      <span class="dot"></span>
      Theo dõi sức khỏe cá nhân
    </p>
    <h1 class="hero__title" id="heroTitle">Đăng nhập<br>để bắt đầu</h1>
    <p class="hero__note" id="heroNote">Mỗi người một hành trình riêng — dữ liệu & gợi ý được cá nhân hoá.</p>
  </section>

  <!-- ===== Chưa đăng nhập: form đăng nhập / tạo tài khoản ===== -->
  <section class="authbox" id="authBox">
    <div class="authtabs">
      <button type="button" class="authtab on" id="tabLogin">Đăng nhập</button>
      <button type="button" class="authtab" id="tabRegister">Tạo tài khoản</button>
    </div>

    <div class="auth-msg" id="authMsg"></div>

    <!-- Đăng nhập -->
    <form class="authform on" id="formLogin">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-auth" id="btnLogin">Đăng nhập</button>
    </form>

    <!-- Tạo tài khoản -->
    <form class="authform" id="formRegister">
      <div class="field">
        <label>Tên hiển thị</label>
        <input type="text" id="regName" placeholder="Hồng Phúc / Ngọc Anh" required>
      </div>
      <div class="field">
        <label>Bạn là</label>
        <div class="gender-pick" id="genderPick">
          <div class="gender-opt sel" data-v="male">Nam</div>
          <div class="gender-opt" data-v="female">Nữ</div>
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="regPassword" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn-auth" id="btnRegister">Tạo tài khoản</button>
    </form>
  </section>

  <!-- ===== Đã đăng nhập: vào dashboard của mình / xem đối tác ===== -->
  <section class="who-card" id="whoCard" style="display:none">
    <div class="who-name">Chào, <b id="whoName">bạn</b></div>
    <div class="who-actions">
      <button type="button" class="btn-auth" id="btnGoMine">Vào trang của tôi</button>
      <button type="button" class="btn-ghost-auth" id="btnGoPartner" style="display:none">Xem trang đối tác (chỉ xem)</button>
      <button type="button" class="btn-ghost-auth" id="btnLogout">Đăng xuất</button>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer__dot"></span>
    VITAL · v3.0 · Supabase
  </footer>
</main>

<!-- Loading overlay -->
<div class="loader" id="loader" aria-hidden="true">
  <div class="loader__ring">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/>
      <circle id="loader-arc" cx="28" cy="28" r="22" fill="none" stroke="white" stroke-width="4"
        stroke-dasharray="138.2" stroke-dashoffset="138.2" stroke-linecap="round"
        transform="rotate(-90 28 28)"/>
    </svg>
  </div>
  <div class="loader__name" id="loader-name"></div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="index.js"></script>
</body>
</html>
