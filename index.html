<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0F1A">
<title>VITAL · Chọn hồ sơ</title>
<!-- PWA: cài lên điện thoại + chạy offline -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VITAL">
<script>if('serviceWorker'in navigator){addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){})})}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>

<main class="scene" id="scene">
  <canvas id="particles" aria-hidden="true"></canvas>

  <!-- Header -->
  <header class="hd">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span>VITAL</span>
    </div>
    <div class="greeting" id="greeting"></div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <p class="hero__eyebrow">
      <span class="dot"></span>
      Theo dõi sức khỏe cá nhân
    </p>
    <h1 class="hero__title">Chọn hồ sơ<br>để bắt đầu</h1>
    <p class="hero__note">Mỗi người một hành trình riêng — dữ liệu & gợi ý được cá nhân hoá.</p>
  </section>

  <!-- Cards -->
  <section class="cards" aria-label="Danh sách hồ sơ">

    <!-- Phúc -->
    <a class="card card--phuc" id="card-phuc" href="H.Phuc/Phuc_calo.html" data-who="phuc">
      <span class="card__glow" aria-hidden="true"></span>
      <span class="card__ring" aria-hidden="true"></span>

      <div class="card__top">
        <span class="card__avatar" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span class="card__chip">Nam</span>
      </div>

      <div class="card__body">
        <h2 class="card__name">Hồng Phúc</h2>
        <p class="card__label">FORGE · Data-driven</p>
      </div>

      <div class="card__pills" aria-hidden="true">
        <span class="pill">Calo</span>
        <span class="pill">Protein</span>
        <span class="pill">Tiến độ</span>
        <span class="pill">Dự báo</span>
      </div>

      <div class="card__foot">
        <div class="card__streak" id="streak-phuc"></div>
        <span class="card__arrow" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </span>
      </div>

      <span class="ripple-layer" id="ripple-phuc" aria-hidden="true"></span>
    </a>

    <!-- Ngọc Anh -->
    <a class="card card--anh" id="card-anh" href="N.Anh/Anh_calo.html" data-who="anh">
      <span class="card__glow" aria-hidden="true"></span>
      <span class="card__ring" aria-hidden="true"></span>

      <div class="card__top">
        <span class="card__avatar" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span class="card__chip">Nữ</span>
      </div>

      <div class="card__body">
        <h2 class="card__name">Ngọc Anh</h2>
        <p class="card__label">ÉLYSÉE · Sang trọng</p>
      </div>

      <div class="card__pills" aria-hidden="true">
        <span class="pill">Calo</span>
        <span class="pill">Chu kỳ</span>
        <span class="pill">Cơ thể</span>
        <span class="pill">Dự báo</span>
      </div>

      <div class="card__foot">
        <div class="card__streak" id="streak-anh"></div>
        <span class="card__arrow" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </span>
      </div>

      <span class="ripple-layer" id="ripple-anh" aria-hidden="true"></span>
    </a>

  </section>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer__dot"></span>
    VITAL · v2.0 · Mobile-first
  </footer>
</main>

<!-- Loading overlay -->
<div class="loader" id="loader" aria-hidden="true">
  <div class="loader__ring">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/>
      <circle id="loader-arc" cx="28" cy="28" r="22" fill="none" stroke="white" stroke-width="4"
        stroke-dasharray="138.2" stroke-dashoffset="138.2" stroke-linecap="round"
        transform="rotate(-90 28 28)"/>
    </svg>
  </div>
  <div class="loader__name" id="loader-name"></div>
</div>

<!-- SQLite trong trình duyệt (để hiện streak/cân thật trên thẻ hồ sơ) -->
<script src="vendor/sqljs/sql-wasm.js"></script>
<script src="shared/vital-sqlite.js"></script>
<script src="index.js"></script>
</body>
</html>
